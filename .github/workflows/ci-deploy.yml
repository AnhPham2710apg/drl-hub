name: CI & Auto Deploy to Render

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # STAGE 1: CI QUALITY GATES (Lint, Test, Build)
  # ==========================================
  ci-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Generate Prisma Client
        run: npm run db:generate --workspace=@drl-hub/database

      - name: 5. Run All Quality Unit Tests (The Harness)
        run: npm test

      - name: 6. Build Project Artifacts
        run: npm run build

  # ==========================================
  # STAGE 2: CONTINUOUS DEPLOYMENT TO RENDER
  # (Chỉ kích hoạt khi CI ở trên PASS 100%)
  # ==========================================
  deploy-to-render:
    needs: ci-test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️ [Warning] RENDER_DEPLOY_HOOK_URL secret is not set yet in GitHub Repository Secrets."
            echo "👉 Vui lòng thêm secret này để tự động kích hoạt deploy trên Render sau khi test passed."
            exit 0
          fi
          echo "Triggering Render deployment..."
          curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "✅ Render deployment triggered successfully!"
